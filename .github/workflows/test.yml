name: test-and-build

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --windowed --name VideoDuplicateFinder video_duplicate_finder.py
      - uses: actions/upload-artifact@v4
        with:
          name: VideoDuplicateFinder-Windows
          path: dist/VideoDuplicateFinder.exe
          if-no-files-found: error
